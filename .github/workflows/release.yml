name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `pnpm changeset publish` publishes every package with a changeset — both
      # version bumps on existing packages AND brand-new packages on their first
      # release. The root `.npmrc` sets `access=public`, so scoped new packages
      # publish correctly without any extra flag.
      #
      # Do NOT re-add a fallback that republishes "missing" packages. A previous
      # fallback step did exactly this and raced with npm registry eventual
      # consistency: right after changeset publish released a new version, `npm view`
      # could still 404, so the fallback re-published the same version → E403
      # "cannot publish over previously published versions", which skipped the
      # GitHub Release step. The fallback's premise (that changeset publish cannot
      # handle brand-new packages) was false once `.npmrc access=public` was in place.
      - name: Publish to npm
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
